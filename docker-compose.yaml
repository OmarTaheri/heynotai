# Production-shaped stack for Coolify and local Docker Compose.
services:
  postgres:
    image: postgres:16-alpine
    container_name: heynotai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-heynotai}
      POSTGRES_USER: ${POSTGRES_USER:-heynotai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: heynotai-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8787"
    volumes:
      - uploads_data:/data/uploads
    environment:
      PORT: "8787"
      # Set DATABASE_URL to point at an external/managed Postgres (a Coolify
      # database resource, for instance); leave it unset to use the bundled
      # `postgres` service below.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-heynotai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-heynotai}}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      UPLOAD_DIR: /data/uploads
      API_PUBLIC_URL: ${API_PUBLIC_URL:-${SERVICE_URL_API:-http://localhost:8787}}
      FRONTEND_URL: ${FRONTEND_URL:-${SERVICE_URL_FRONTEND:-http://localhost:3000}}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      AUTH_PASSWORD_PEPPER: ${AUTH_PASSWORD_PEPPER:?Set AUTH_PASSWORD_PEPPER}
      FILE_URL_SECRET: ${FILE_URL_SECRET:?Set FILE_URL_SECRET}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-2592000}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-2592000}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:?Set CREDENTIAL_ENCRYPTION_KEY}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      EXTENSION_IDS: ${EXTENSION_IDS:-}
      ALLOWED_LOCAL_MODEL_HOSTS: ${ALLOWED_LOCAL_MODEL_HOSTS:-}
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
      VELMA_API_KEY: ${VELMA_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_VERIFY_MONTHLY: ${STRIPE_PRICE_VERIFY_MONTHLY:-}
      STRIPE_PRICE_VERIFY_YEARLY: ${STRIPE_PRICE_VERIFY_YEARLY:-}
      STRIPE_PRICE_CERTIFY_MONTHLY: ${STRIPE_PRICE_CERTIFY_MONTHLY:-}
      STRIPE_PRICE_CERTIFY_YEARLY: ${STRIPE_PRICE_CERTIFY_YEARLY:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_YEARLY: ${STRIPE_PRICE_TEAM_YEARLY:-}
      # Optional one-time seed of the Chrome Web Store reviewer account. The
      # API creates or syncs it at boot when both are set (see
      # api/src/services/seed-reviewer.ts) and ignores them when they are not.
      REVIEWER_EMAIL: ${REVIEWER_EMAIL:-}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:-}
      REVIEWER_PLAN: ${REVIEWER_PLAN:-}
      MODAL_AUDIO_API_KEY: ${MODAL_AUDIO_API_KEY:-}
      SERVICE_FQDN_API_8787: ${SERVICE_FQDN_API_8787:-}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        VITE_API_URL: ${NEXT_PUBLIC_API_URL:-}
        VITE_FRONTEND_URL: ${FRONTEND_URL:-}
    container_name: heynotai-frontend
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      SERVICE_FQDN_FRONTEND_3000: ${SERVICE_FQDN_FRONTEND_3000:-}

volumes:
  postgres_data:
  uploads_data:
